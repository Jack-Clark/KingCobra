name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest is x86-64, which is the only platform the bundled
    # libmonosat.so supports, so the end-to-end tests can run here.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MonoSAT into the local repository
        run: |
          mvn -B install:install-file -Dfile=./monosat/monosat.jar \
            -DgroupId=monosat -DartifactId=monosat -Dversion=1.4.0 \
            -Dpackaging=jar -DgeneratePom=true

      - name: Java unit tests
        run: mvn -B test

      - name: Build the verifier
        # No CUDA on the runner, so run.sh skips the JNI step and the CPU
        # reachability path is used.
        run: ./run.sh build

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests -v
